function rand(n){return Math.floor(Math.random()*n)}

function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);viewW=Math.max(1,r.width);viewH=Math.max(1,r.height);canvas.width=Math.round(viewW*d);canvas.height=Math.round(viewH*d);ctx.setTransform(d,0,0,d,0,0)}

function start(){cancelAnimationFrame(raf);const mode=$('mode').value,difficulty=Number($('difficulty').value||1);game={mode,difficulty,colors:[$('color1').value,$('color2').value],duration:Number($('duration').value)*60,elapsed:0,paused:false,over:false,players:[{correct:0,hp:10,lockUntil:0},{correct:0,hp:10,lockUntil:0}],units:[],towers:[],aiNext:aiDelays[difficulty-1]/1000};particles=[];shots=[];$('s1').style.color=game.colors[0];$('hp1').style.color=game.colors[0];$('s2').style.color=game.colors[1];$('hp2').style.color=game.colors[1];for(let side=0;side<2;side++)for(let i=0;i<2;i++)game.towers.push({side,x:i===0?.18:.82,y:side===0?.78:.22,hp:8,max:8,cool:0});$('quiz2').hidden=mode!=='pvp';$('menu').hidden=true;$('end').hidden=true;$('pauseMenu').hidden=true;$('pause').textContent='Pauza';setQuestion(0);if(mode==='pvp')setQuestion(1);resize();last=performance.now();raf=requestAnimationFrame(frame)}
function hit(target,dmg,x,y,color){target.hp-=dmg;particles.push({x,y,life:.4,color});if(target.hp<=0)particles.push({x,y,life:.7,color,big:true})}
function fire(source,target,damage,color,kind){
if(!target||target.hp<=0)return;

if(shots.length>110)shots.splice(0,shots.length-110)}
function moveShots(dt){for(const shot of shots)shot.life-=dt;shots=shots.filter(s=>s.life>0)}
function combat(dt){
const u=game.units,active=[[],[]],liveTowers=[[],[]];
for(const e of u)if(e.hp>0)active[e.side].push(e);
for(const t of game.towers)if(t.hp>0)liveTowers[t.side].push(t);
for(const unit of u){
if(unit.hp<=0)continue;
if(game.elapsed%0.06<dt){unit.trail.push({x:unit.x,y:unit.y});if(unit.trail.length>5)unit.trail.shift()}
const s=types[unit.type];unit.cool-=dt;unit.retarget-=dt;
let chosen=unit.target;
if(unit.retarget<=0||!chosen||chosen.hp<=0){
unit.retarget=.16+Math.random()*.08;chosen=null;let bestSq=Infinity;
for(const enemy of active[1-unit.side]){if(enemy.hp<=0)continue;const dx=(enemy.x-unit.x)*viewW,dy=(enemy.y-unit.y)*viewH,distSq=dx*dx+dy*dy;if(distSq<bestSq){bestSq=distSq;chosen=enemy}}
let tower=null,tdSq=Infinity;for(const t of liveTowers[1-unit.side]){const dx=(t.x-unit.x)*viewW,dy=(t.y-unit.y)*viewH,dSq=dx*dx+dy*dy;if(dSq<tdSq){tdSq=dSq;tower=t}}

const dist=chosen?Math.hypot((chosen.x-unit.x)*viewW,(chosen.y-unit.y)*viewH):Infinity;
if(chosen&&chosen.hp>0&&dist<=s.range+10){if(unit.cool<=0){fire(unit,chosen,s.damage,teamColor(unit.side),unit.type==='tri'?'beam':unit.type==='hex'?'pulse':'shell');unit.cool=s.rate}}
else{const tx=chosen&&chosen.hp>0?chosen.x:.5,ty=chosen&&chosen.hp>0?chosen.y:(unit.side===0?.045:.955),dx=(tx-unit.x)*viewW,dy=(ty-unit.y)*viewH,d=Math.hypot(dx,dy)||1;unit.x+=dx/d*s.speed*dt/viewW;unit.y+=dy/d*s.speed*dt/viewH}
if((unit.side===0&&unit.y<=.055)||(unit.side===1&&unit.y>=.945)){game.players[1-unit.side].hp=Math.max(0,game.players[1-unit.side].hp-1);unit.hp=0;particles.push({x:unit.x,y:unit.y,life:.8,big:true,color:teamColor(unit.side)})}}
for(const t of game.towers){if(t.hp<=0)continue;t.cool-=dt;if(t.cool>0)continue;let target=null,bestSq=Math.min(viewW*.45,125)**2;for(const e of active[1-t.side]){if(e.hp<=0)continue;const dx=(e.x-t.x)*viewW,dy=(e.y-t.y)*viewH,dSq=dx*dx+dy*dy;if(dSq<bestSq){target=e;bestSq=dSq}}if(target){fire(t,target,2,teamColor(t.side),'beam');t.cool=1.15}}

let result=winner<0?'REMIS!':game.mode==='ai'&&winner===1?'WYGRYWA KOMPUTER – '+colorName(1)+'!':'WYGRYWA GRACZ '+(winner+1)+' – '+colorName(winner)+'!';

function polygon(x,y,r,n,rot=0){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+Math.PI*2*i/n;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
let arenaBackground=null,bgW=0,bgH=0;
const unitSpriteCache=new Map();
function getUnitSprite(type,side,color){

g.translate(24,24);g.strokeStyle=color;g.fillStyle='#14243a';g.lineWidth=1.05;

function rectNeon(x,y,w,h){g.save();g.globalAlpha=.22;g.lineWidth=3;g.strokeRect(x,y,w,h);g.restore();g.strokeRect(x,y,w,h)}
function poly(r,n,angle){g.beginPath();for(let i=0;i<n;i++){const a=angle+i*Math.PI*2/n;if(i===0)g.moveTo(Math.cos(a)*r,Math.sin(a)*r);else g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath()}

function draw(){
const w=viewW,h=viewH;if(!arenaBackground||bgW!==w||bgH!==h){bgW=w;bgH=h;arenaBackground=document.createElement('canvas');arenaBackground.width=Math.ceil(w);arenaBackground.height=Math.ceil(h);const bg=arenaBackground.getContext('2d');bg.fillStyle='#0b1427';bg.fillRect(0,0,w,h);bg.strokeStyle='#233149';bg.lineWidth=.6;for(let x=0;x<w;x+=24){bg.beginPath();bg.moveTo(x,0);bg.lineTo(x,h);bg.stroke()}for(let y=0;y<h;y+=24){bg.beginPath();bg.moveTo(0,y);bg.lineTo(w,y);bg.stroke()}bg.setLineDash([4,7]);bg.strokeStyle='#53617a';bg.beginPath();bg.moveTo(0,h/2);bg.lineTo(w,h/2);bg.stroke();bg.setLineDash([])}ctx.drawImage(arenaBackground,0,0);

for(const t of game?.towers||[]){if(t.hp<=0)continue;const color=teamColor(t.side),x=t.x*w,y=t.y*h,dir=t.side===0?-1:1;
ctx.save();ctx.translate(x,y);ctx.strokeStyle=color;ctx.fillStyle='#17263c';ctx.shadowBlur=0;ctx.lineWidth=1.5;
polygon(0,0,15,6,Math.PI/6);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
ctx.fillStyle='#0b1427';ctx.fillRect(-5,-10,10,20);ctx.strokeRect(-5,-10,10,20);

for(const u of game?.units||[]){const x=u.x*w,y=u.y*h,c=teamColor(u.side),dir=u.side===0?-1:1;
if(game.units.length<110&&u.trail?.length>1){ctx.save();ctx.strokeStyle=c;ctx.globalAlpha=.11;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(u.trail[0].x*w,u.trail[0].y*h);for(let i=1;i<u.trail.length;i++)ctx.lineTo(u.trail[i].x*w,u.trail[i].y*h);ctx.stroke();ctx.restore()}

for(const shot of shots){const alpha=shot.life/shot.maxLife;ctx.save();ctx.lineCap='round';ctx.strokeStyle=shot.color;ctx.globalAlpha=alpha*.2;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(shot.x1*w,shot.y1*h);ctx.lineTo(shot.x2*w,shot.y2*h);ctx.stroke();ctx.globalAlpha=alpha;ctx.lineWidth=1.15;ctx.stroke();ctx.restore()}
for(const p of particles){const x=p.x*w,y=p.y*h;ctx.strokeStyle=p.color;ctx.globalAlpha=Math.min(1,p.life*2);ctx.beginPath();ctx.arc(x,y,(p.big?20:9)*(1-p.life*.4),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
}
function hud(){if(!game)return;for(let i=0;i<2;i++){const p=game.players[i];$('s'+(i+1)).textContent='✓ '+p.correct+' · ARMIA '+level(p)+'/11';$('hp'+(i+1)).textContent='BAZA '+p.hp+'/10 HP'}const sec=Math.max(0,Math.ceil(game.duration-game.elapsed));$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function frame(now){if(!game||game.over)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!game.paused){game.elapsed+=dt;if(game.mode==='ai'&&game.elapsed>=game.aiNext){const p=game.players[1];if(game.elapsed>=p.lockUntil){p.q=question();if(Math.random()<errorRates[game.difficulty-1])p.lockUntil=game.elapsed+2;else{p.correct++;spawn(1)}}game.aiNext=game.elapsed+aiDelays[game.difficulty-1]/1000}combat(dt)}updateLocks();hud();draw();if(!game.over)raf=requestAnimationFrame(frame)}
