n],#end[hidden],#pauseMenu[hidden],.lock[hidden]{display:none!important}.overlay{position:fixed;z-index:20;inset:0;background:#050a16ed;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.dialog{width:min(430px,100%);border:1px solid #3a5979;background:#101c30;border-radius:17px;padding:22px;box-shadow:0 0 45px #15c9ff19}.dialog h1{margin:0 0 7px;color:#56eaff;font-size:clamp(25px,7vw,35px)}.dialog p{color:#b9c8d9;line-height:1.45}.dialog label{display:block;margin:14px 0 5px}.dialog select,.dialog button{width:100%;padding:12px;background:#1a3047;color:#fff;border:1px solid #52718c;border-radius:9px}.dialog button{margin-top:17px;background:#087d9e;font-weight:800}.dialog small{color:#9caec3}#pause{border:1px solid #465e79;border-radius:7px;background:#14263b;color:#d8f5ff;padding:5px 9px}@media(max-height:650px){header{padding:1px}.question{min-height:27px}.answers button{min-height:36px;padding:6px 0}#panel{gap:2px;padding:3px 0}}

<div id="menu" class="overlay"><div class="dialog"><h1>POJEDYNEK ILOCZYNU</h1><label for="mode">Tryb gry</label><select id="mode"><option value="ai">Gracz kontra komputer</option><option value="pvp">Dwóch graczy – jeden ekran</option></select><label for="duration">Czas bitwy</label><select id="duration"><option value="3">3 minuty</option><option value="5" selected>5 minut</option><option value="10">10 minut</option></select><div class="colorChoices"><label for="color1">Kolor gracza 1</label><select id="color1"></select><label for="color2" id="color2label">Kolor komputera</label><select id="color2"></select></div><div id="difficultyBox"><label for="difficulty">Poziom komputera</label><select id="difficulty"></select></div><button id="start">ROZPOCZNIJ BITWĘ</button></div></div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');
const palette=[{name:'Turkusowy',hex:'#37e7ff'},{name:'Różowy',hex:'#ff5986'},{name:'Zielony',hex:'#4cf59b'},{name:'Żółty',hex:'#ffe16a'},{name:'Fioletowy',hex:'#b58aff'},{name:'Pomarańczowy',hex:'#ffab59'},{name:'Biały',hex:'#f2f5ff'}];
const teamColor=side=>game?.colors?.[side]||palette[side].hex;
const errorRates=[.35,.30,.25,.20,.10,.06,.04,.025,.01,0];
const aiDelays=[6500,5700,5000,4400,3000,2600,2200,1850,1550,1200];
const types={rect:{hp:8,damage:2,range:19,speed:29,rate:1.1},tri:{hp:4,damage:2,range:110,speed:24,rate:1.5},pent:{hp:16,damage:3,range:20,speed:18,rate:1.2},hex:{hp:10,damage:1,range:95,speed:21,rate:1.6},diamond:{hp:6,damage:4,range:20,speed:46,rate:.9},oct:{hp:24,damage:5,range:25,speed:23,rate:1.1}};
const comps=['rect','tri','pent','hex','diamond','oct'];
let game=null,raf=0,last=0,viewW=320,viewH=500,particles=[],shots=[];
for(let i=1;i<=10;i++){const o=document.createElement('option');o.value=i;o.textContent=i+' – '+(['Klasa 2','Klasa 3','Klasa 4','Klasa 5','Klasa 6','Klasa 7','Klasa 8','Liceum','Elita','Maniak'][i-1]);$('difficulty').append(o)}
function syncColors(changed){const a=$('color1'),b=$('color2');if(a.value===b.value){const other=changed==='color1'?b:a;other.value=palette.find(p=>p.hex!== (changed==='color1'?a.value:b.value)).hex}for(const sel of [a,b]){for(const opt of sel.options)opt.disabled=opt.value===(sel===a?b.value:a.value);sel.style.borderColor=sel.value;sel.style.color=sel.value}}for(const [id,selected] of [['color1',0],['color2',1]]){const sel=$(id);palette.forEach(p=>{const o=document.createElement('option');o.value=p.hex;o.textContent=p.name;sel.append(o)});sel.value=palette[selected].hex;sel.onchange=()=>syncColors(id)}syncColors('color1');$('mode').onchange=()=>{$('difficultyBox').hidden=$('mode').value==='pvp';$('color2label').textContent=$('mode').value==='pvp'?'Kolor gracza 2':'Kolor komputera'};
function rand(n){return Math.floor(Math.random()*n)}
function question(){const a=1+rand(10),b=1+rand(10),right=a*b,opts=new Set([right]);let guard=0;while(opts.size<4&&guard++<100){let v=guard%3===0?right+(rand(7)-3): (1+rand(10))*(1+rand(10));if(v>0&&v<=100)opts.add(v)}while(opts.size<4)opts.add(1+rand(100));return {label:a+' × '+b+' = ?',right,opts:[...opts].sort(()=>Math.random()-.5)}}
function level(p){return Math.min(11,1+Math.floor(p.correct/10))}
function spawn(side){const p=game.players[side],lv=level(p),pool=['rect'];if(lv>=2)pool.push('tri');if(lv>=5)pool.push('pent');if(lv>=6)pool.push('diamond');if(lv>=7)pool.push('hex');if(lv>=10)pool.push('oct');const roster=['rect','rect'];if(lv>=2)roster.push('tri');if(lv>=3)roster.push('rect');if(lv>=4)roster.push('tri');if(lv>=5)roster.push('pent');if(lv>=6)roster.push('diamond');if(lv>=7)roster.push('hex');if(lv>=8)roster.push('rect');if(lv>=9)roster.push('pent');if(lv>=10)roster.push('oct');if(lv>=11)roster.push('tri');for(let i=0;i<roster.length;i++){const type=roster[i],stat=types[type];game.units.push({side,type,x:.07+Math.random()*.86,y:side===0?.89-(Math.floor(i/5)*.028):.11+Math.floor(i/5)*.028,hp:stat.hp,max:stat.hp,cool:Math.random()*.5,trail:[]})}if(game.units.length>500)game.units.splice(0,game.units.length-500)}
function setQuestion(side){const p=game.players[side];p.q=question();const id=side+1;$('q'+id).textContent=p.q.label;const area=$('a'+id);area.replaceChildren();p.q.opts.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(side,v);area.append(b)});updateLocks()}
function updateLocks(){if(!game)return;for(let side=0;side<2;side++){const p=game.players[side],locked=game.paused||game.elapsed<p.lockUntil;const el=$('lock'+(side+1));el.hidden=!locked;el.textContent=game.paused?'PAUZA':'BŁĄD · '+Math.ceil(p.lockUntil-game.elapsed)+' s';$('a'+(side+1)).querySelectorAll('button').forEach(b=>b.disabled=locked)}}
function answer(side,value){if(!game||game.over||game.paused)return;const p=game.players[side];if(game.elapsed<p.lockUntil)return;if(value===p.q.right){p.correct++;spawn(side);setQuestion(side)}else{p.lockUntil=game.elapsed+2;updateLocks()}}
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);viewW=Math.max(1,r.width);viewH=Math.max(1,r.height);canvas.width=Math.round(viewW*d);canvas.height=Math.round(viewH*d);ctx.setTransform(d,0,0,d,0,0)}
new ResizeObserver(resize).observe(canvas);
function start(){cancelAnimationFrame(raf);const mode=$('mode').value,difficulty=Number($('difficulty').value||1);game={mode,difficulty,colors:[$('color1').value,$('color2').value],duration:Number($('duration').value)*60,elapsed:0,paused:false,over:false,players:[{correct:0,hp:10,lockUntil:0},{correct:0,hp:10,lockUntil:0}],units:[],towers:[],aiNext:aiDelays[difficulty-1]/1000};particles=[];shots=[];$('s1').style.color=game.colors[0];$('hp1').style.color=game.colors[0];$('s2').style.color=game.colors[1];$('hp2').style.color=game.colors[1];for(let side=0;side<2;side++)for(let i=0;i<2;i++)game.towers.push({side,x:i===0?.18:.82,y:side===0?.78:.22,hp:8,max:8,cool:0});$('quiz2').hidden=mode!=='pvp';$('menu').hidden=true;$('end').hidden=true;$('pauseMenu').hidden=true;$('pause').textContent='Pauza';setQuestion(0);if(mode==='pvp')setQuestion(1);resize();last=performance.now();raf=requestAnimationFrame(frame)}
function hit(target,dmg,x,y,color){target.hp-=dmg;particles.push({x,y,life:.4,color});if(target.hp<=0)particles.push({x,y,life:.7,color,big:true})}
function fire(source,target,damage,color,kind){const distance=Math.hypot((target.x-source.x)*viewW,(target.y-source.y)*viewH);shots.push({x:source.x,y:source.y,prevX:source.x,prevY:source.y,target,damage,color,kind,speed:kind==='beam'?440:kind==='shell'?240:330,life:Math.max(.12,distance/180+1)});if(shots.length>260)shots.shift()}
function moveShots(dt){for(const shot of shots){shot.life-=dt;if(shot.life<=0)continue;if(!shot.target||shot.target.hp<=0){shot.life=0;continue}shot.prevX=shot.x;shot.prevY=shot.y;const dx=(shot.target.x-shot.x)*viewW,dy=(shot.target.y-shot.y)*viewH,dist=Math.hypot(dx,dy);const step=shot.speed*dt;if(dist<=Math.max(step,5)){shot.x=shot.target.x;shot.y=shot.target.y;hit(shot.target,shot.damage,shot.x,shot.y,shot.color);shot.life=0}else if(dist>0){shot.x+=dx/dist*step/viewW;shot.y+=dy/dist*step/viewH}}shots=shots.filter(s=>s.life>0)}
function combat(dt){const u=game.units;for(const unit of u){if(unit.hp<=0)continue;unit.trail.push({x:unit.x,y:unit.y});if(unit.trail.length>8)unit.trail.shift();const s=types[unit.type],dir=unit.side===0?-1:1;unit.cool-=dt;let target=null,best=Infinity;for(const enemy of u){if(enemy.side===unit.side||enemy.hp<=0)continue;const dx=(enemy.x-unit.x)*viewW,dy=(enemy.y-unit.y)*viewH,dist=Math.hypot(dx,dy);if(dist<best){best=dist;target=enemy}}const towers=game.towers.filter(t=>t.side!==unit.side&&t.hp>0);let tower=null,td=Infinity;for(const t of towers){const d=Math.hypot((t.x-unit.x)*viewW,(t.y-unit.y)*viewH);if(d<td){td=d;tower=t}}let chosen=null,dist=Infinity;if(target&&best<Math.min(185,viewH*.42)){chosen=target;dist=best}else if(tower){chosen=tower;dist=td}else if(target){chosen=target;dist=best}
if(chosen&&dist<=s.range+10){if(unit.cool<=0){fire(unit,chosen,s.damage,teamColor(unit.side),unit.type==='tri'?'beam':unit.type==='hex'?'pulse':'shell');unit.cool=s.rate}}else{let tx=chosen?chosen.x:.5,ty=chosen?chosen.y:(unit.side===0?.045:.955);const dx=(tx-unit.x)*viewW,dy=(ty-unit.y)*viewH,d=Math.hypot(dx,dy)||1;unit.x+=dx/d*s.speed*dt/viewW;unit.y+=dy/d*s.speed*dt/viewH}
if((unit.side===0&&unit.y<=.055)||(unit.side===1&&unit.y>=.945)){game.players[1-unit.side].hp=Math.max(0,game.players[1-unit.side].hp-1);unit.hp=0;particles.push({x:unit.x,y:unit.y,life:.8,big:true,color:teamColor(unit.side)})}}
for(const t of game.towers){if(t.hp<=0)continue;t.cool-=dt;let target=null,dist=Infinity;for(const e of u){if(e.side===t.side||e.hp<=0)continue;const d=Math.hypot((e.x-t.x)*viewW,(e.y-t.y)*viewH);if(d<dist&&d<Math.min(viewW*.45,125)){target=e;dist=d}}if(target&&t.cool<=0){fire(t,target,2,teamColor(t.side),'beam');t.cool=1.15}}
moveShots(dt);game.units=u.filter(e=>e.hp>0&&e.x>=0&&e.x<=1);particles=particles.filter(p=>(p.life-=dt)>0);if(game.players.some(p=>p.hp<=0))finish();else if(game.elapsed>=game.duration)finish()}
function finish(){game.over=true;cancelAnimationFrame(raf);const [a,b]=game.players;let result=a.hp===b.hp?'REMIS!':a.hp>b.hp?'WYGRYWA GRACZ 1!':game.mode==='ai'?'WYGRYWA KOMPUTER!':'WYGRYWA GRACZ 2!';$('result').textContent=result;$('summary').textContent='Bazy: '+a.hp+' : '+b.hp+' HP · Poprawne odpowiedzi: '+a.correct+' : '+b.correct+'.';$('end').hidden=false}
function polygon(x,y,r,n,rot=0){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+Math.PI*2*i/n;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function draw(){
const w=viewW,h=viewH;ctx.clearRect(0,0,w,h);ctx.fillStyle='#0b1427';ctx.fillRect(0,0,w,h);
ctx.strokeStyle='#233149';ctx.lineWidth=.6;for(let x=0;x<w;x+=24){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=24){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
ctx.setLineDash([4,7]);ctx.strokeStyle='#53617a';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();ctx.setLineDash([]);
for(let side=0;side<2;side++){const color=teamColor(side),y=(side===0?.965:.035)*h,dir=side===0?-1:1,x=w/2;
ctx.save();ctx.translate(x,y);ctx.strokeStyle=color;ctx.fillStyle='#142238';ctx.shadowColor=color;ctx.shadowBlur=13;ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(-w*.17,-9);ctx.lineTo(-w*.12,-16);ctx.lineTo(w*.12,-16);ctx.lineTo(w*.17,-9);ctx.lineTo(w*.17,9);ctx.lineTo(w*.12,16);ctx.lineTo(-w*.12,16);ctx.lineTo(-w*.17,9);ctx.closePath();ctx.fill();ctx.stroke();
ctx.shadowBlur=0;ctx.strokeRect(-w*.09,-10,w*.18,20);ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-w*.15,0);ctx.lineTo(-w*.11,0);ctx.moveTo(w*.11,0);ctx.lineTo(w*.15,0);ctx.stroke();ctx.restore()}
for(const t of game?.towers||[]){if(t.hp<=0)continue;const color=teamColor(t.side),x=t.x*w,y=t.y*h,dir=t.side===0?-1:1;
ctx.save();ctx.translate(x,y);ctx.strokeStyle=color;ctx.fillStyle='#17263c';ctx.shadowColor=color;ctx.shadowBlur=10;ctx.lineWidth=1.8;
polygon(0,0,15,6,Math.PI/6);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
ctx.fillStyle='#0b1427';ctx.fillRect(-5,-10,10,20);ctx.strokeRect(-5,-10,10,20);
ctx.fillStyle=color;ctx.fillRect(-3,dir===-1?-23:9,6,14);ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.stroke();
ctx.restore();ctx.save();ctx.strokeStyle='#33445b';ctx.lineWidth=3.5;ctx.shadowBlur=0;ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=6;ctx.lineCap='round';ctx.beginPath();ctx.arc(x,y,22,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.max(0,t.hp)/t.max);ctx.stroke();ctx.restore()}
for(const u of game?.units||[]){const x=u.x*w,y=u.y*h,c=teamColor(u.side),dir=u.side===0?-1:1;
ctx.save();ctx.strokeStyle=c;ctx.shadowColor=c;ctx.lineWidth=1.8;
if(u.trail?.length>1){for(let i=1;i<u.trail.length;i++){ctx.globalAlpha=.035+.18*i/u.trail.length;ctx.shadowBlur=12;ctx.lineWidth=2+i/u.trail.length*3;ctx.beginPath();ctx.moveTo(u.trail[i-1].x*w,u.trail[i-1].y*h);ctx.lineTo(u.trail[i].x*w,u.trail[i].y*h);ctx.stroke()}ctx.globalAlpha=1}
ctx.translate(x,y);ctx.shadowBlur=9;ctx.fillStyle='#14243a';
if(u.type==='rect'){ctx.fillRect(-6,-9,12,18);ctx.strokeRect(-6,-9,12,18);ctx.fillRect(-2,dir===-1?-17:8,4,10);ctx.strokeRect(-2,dir===-1?-17:8,4,10);ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.stroke()}
else if(u.type==='tri'){ctx.beginPath();ctx.moveTo(0,dir*13);ctx.lineTo(-9,-dir*9);ctx.lineTo(0,-dir*5);ctx.lineTo(9,-dir*9);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-13,-dir*1);ctx.lineTo(13,-dir*1);ctx.moveTo(-4,-dir*12);ctx.lineTo(4,-dir*12);ctx.stroke()}
else if(u.type==='pent'){polygon(0,0,11,5,dir*Math.PI/2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.stroke()}
else if(u.type==='hex'){polygon(0,0,10,6,Math.PI/6);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.moveTo(0,-7);ctx.lineTo(0,7);ctx.stroke()}
else if(u.type==='diamond'){polygon(0,0,10,4,Math.PI/4);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,dir*8);ctx.lineTo(0,-dir*8);ctx.stroke()}
else{polygon(0,0,13,8,Math.PI/8);ctx.fill();ctx.stroke();polygon(0,0,7,8,Math.PI/8);ctx.stroke()}
ctx.shadowBlur=0;ctx.restore();if(u.hp<u.max){ctx.fillStyle='#172435';ctx.fillRect(x-9,y-19,18,2);ctx.fillStyle=c;ctx.fillRect(x-9,y-19,18*u.hp/u.max,2)}}
for(const shot of shots){const x=shot.x*w,y=shot.y*h,px=shot.prevX*w,py=shot.prevY*h,dx=x-px,dy=y-py,d=Math.hypot(dx,dy)||1,tail=shot.kind==='beam'?16:9;ctx.save();ctx.strokeStyle=shot.color;ctx.fillStyle=shot.color;ctx.shadowColor=shot.color;ctx.shadowBlur=13;ctx.lineWidth=shot.kind==='beam'?2.5:3.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-dx/d*tail,y-dy/d*tail);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.arc(x,y,shot.kind==='shell'?3:2,0,Math.PI*2);ctx.fill();ctx.restore()}
for(const p of particles){const x=p.x*w,y=p.y*h;ctx.strokeStyle=p.color;ctx.globalAlpha=Math.min(1,p.life*2);ctx.beginPath();ctx.arc(x,y,(p.big?20:9)*(1-p.life*.4),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
}
function hud(){if(!game)return;for(let i=0;i<2;i++){const p=game.players[i];$('s'+(i+1)).textContent='✓ '+p.correct+' · ARMIA '+level(p)+'/11';$('hp'+(i+1)).textContent='BAZA '+p.hp+'/10 HP'}const sec=Math.max(0,Math.ceil(game.duration-game.elapsed));$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function frame(now){if(!game||game.over)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!game.paused){game.elapsed+=dt;if(game.mode==='ai'&&game.elapsed>=game.aiNext){const p=game.players[1];if(game.elapsed>=p.lockUntil){p.q=question();if(Math.random()<errorRates[game.difficulty-1])p.lockUntil=game.elapsed+2;else{p.correct++;spawn(1)}}game.aiNext=game.elapsed+aiDelays[game.difficulty-1]/1000}combat(dt)}updateLocks();hud();draw();if(!game.over)raf=requestAnimationFrame(frame)}
function resume(){if(!game||game.over)return;game.paused=false;$('pauseMenu').hidden=true;$('pause').textContent='Pauza';last=performance.now();updateLocks()}function backMenu(){cancelAnimationFrame(raf);game=null;particles=[];$('pauseMenu').hidden=true;$('end').hidden=true;$('menu').hidden=false;$('pause').textContent='Pauza'}$('start').onclick=start;$('again').onclick=backMenu;$('pause').onclick=()=>{if(!game||game.over)return;game.paused=true;$('pauseMenu').hidden=false;$('pause').textContent='Pauza';updateLocks()};$('resume').onclick=resume;$('restart').onclick=start;$('backMenu').onclick=backMenu;
})();
</script></body></html>
